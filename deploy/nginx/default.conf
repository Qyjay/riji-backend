# 通用中转页 /app/go?target= 的服务端白名单：只有 avalin:// 开头的目标算合法。
# target 可能是编码过的（avalin%3A%2F%2F...），两种写法都要认，其余一律判非法。
map $arg_target $avalin_relay_bad_target {
    ""                              0;
    "~*^avalin(:|%3a)(//|%2f%2f)"   0;
    default                         1;
}

server {
    listen 80;
    listen [::]:80;
    server_name avalin.cn www.avalin.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /uploads/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 小 V 快捷指令的 https 中转页：纯静态单文件，页面自己跳 avalin:// Deep Link。
    # 放在 location / 之前只是为了好读，实际匹配靠 ^~ 优先级。
    location ^~ /app/ {
        error_page 403 @avalin_relay_blocked;
        if ($avalin_relay_bad_target) {
            return 403;
        }
        # 路径手输出错（大小写、尾斜杠、拼错）时落到 relay.html，由页面 JS 再纠一次
        try_files $uri $uri.html /app/relay.html;
    }

    location @avalin_relay_blocked {
        try_files /app/blocked.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avalin.cn www.avalin.cn;

    ssl_certificate     /etc/nginx/ssl/avalin.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/avalin.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AvalinSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /uploads/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 小 V 快捷指令的 https 中转页：纯静态单文件，页面自己跳 avalin:// Deep Link。
    # 放在 location / 之前只是为了好读，实际匹配靠 ^~ 优先级。
    location ^~ /app/ {
        error_page 403 @avalin_relay_blocked;
        if ($avalin_relay_bad_target) {
            return 403;
        }
        # 路径手输出错（大小写、尾斜杠、拼错）时落到 relay.html，由页面 JS 再纠一次
        try_files $uri $uri.html /app/relay.html;
    }

    location @avalin_relay_blocked {
        try_files /app/blocked.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
