services:
  mysql:
    image: m.daocloud.io/docker.io/library/mysql:8.4
    container_name: avalin-mysql
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - ./runtime/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: .
    container_name: avalin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
      - ./runtime/data:/app/runtime/data
      - ./runtime/memory_store:/app/runtime/memory_store
    expose:
      - "8000"

  avatar-worker:
    build: .
    container_name: avalin-avatar-worker
    restart: unless-stopped
    command: ["python", "scripts/run_avatar_worker.py"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - ./runtime/uploads:/app/runtime/uploads
      - ./runtime/data:/app/runtime/data
      - ./runtime/memory_store:/app/runtime/memory_store

  nginx:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine
    container_name: avalin-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
